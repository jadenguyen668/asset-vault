<!DOCTYPE html>
<html lang="en" style="color-scheme: dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Asset Viewer</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <meta name="theme-color" content="#0d0d1a" />
  <link rel="stylesheet" href="/src/style.css" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>

<body>
  <!-- Auth Modal (only shown when Supabase is configured and user not logged in) -->
  <div id="auth-modal" class="auth-modal-overlay" style="display:none"></div>

  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="logo">
        <img src="/logo.png" alt="Live Asset" class="logo-icon" onerror="this.src='data:image/svg+xml;utf8,<svg width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%237c5cfc\' stroke-width=\'2\'><circle cx=\'12\' cy=\'12\' r=\'10\'/></svg>'" />
        <span class="logo-text">LIVE <span class="accent">ASSET</span></span>
      </div>
      <div class="header-info">
        <span id="mode-badge" class="badge hidden"></span>
        <span id="version-badge" class="badge hidden">v?.?</span>
        <span id="file-name" class="file-label">No file loaded</span>
        <div id="user-menu"></div>
      </div>
    </header>

    <!-- Main area -->
    <div id="main" class="split-mode">
      <!-- LEFT: Library Panel (full width when no selection, shrinks in split-mode) -->
      <div id="drop-zone" class="drop-zone active">
        <div id="library-panel" class="library-panel">
            <div id="library-sidebar" class="library-sidebar">
              <div class="sidebar-header" style="justify-content: space-between;">
                <div style="display:flex;align-items:center;gap:6px;">
                    <button id="btn-sidebar-toggle" aria-label="Toggle sidebar" style="background:transparent;border:none;color:var(--text);cursor:pointer;padding:2px;display:flex;opacity:0.6;transition:opacity 0.2s;" title="Toggle Sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
                    <span class="sidebar-title-text" style="display:flex;align-items:center;gap:6px;font-weight:700;"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Asset Library</span>
                </div>
              </div>
              <ul id="sidebar-menu" class="sidebar-menu">
                <li class="sidebar-item active" data-type="all">Everything <span id="library-count" class="sidebar-count">0</span></li>
                <div class="sidebar-label">PROJECTS</div>
                <div id="sidebar-projects"></div>
                <div class="sidebar-label">COLLECTIONS</div>
                <div id="sidebar-collections"></div>
              </ul>
            </div>
            <div class="library-main">
              <div class="library-header">
                <input id="library-search" class="library-search" type="text" placeholder="Search assets…" autocomplete="off" name="asset-search" />
                <select id="library-sort" class="library-sort" title="Sort characters">
                  <option value="date-desc">↓ Newest</option>
                  <option value="date-asc">↑ Oldest</option>
                  <option value="name-asc">A→Z Name</option>
                  <option value="name-desc">Z→A Name</option>
                  <option value="version-desc">Version ↓</option>
                  <option value="anims-desc">Anims ↓</option>
                  <option value="size-desc">Size ↓</option>
                  <option value="size-asc">Size ↑</option>
                  <option value="project-asc">Project A→Z</option>
                  <option value="project-desc">Project Z→A</option>
                </select>
                <button id="btn-sidebar-import" class="library-import-btn" title="Import Files">📥 IMPORT</button>
              </div>
              <div class="library-body">
                <div id="library-grid" class="library-grid"></div>
              </div>
            </div>
        </div>
      </div>

      <!-- Resizable divider -->
      <div id="panel-resizer" class="panel-resizer"></div>

      <!-- RIGHT: Viewer + Controls + Properties -->
      <div id="right-panel" class="right-panel">
        <div class="right-panel-header">
          <span class="right-panel-title">Preview</span>
          <button id="btn-maximize-panel" class="collapse-panel-btn" aria-label="Maximize preview" title="Maximize Preview">⛶</button>
          <button id="btn-collapse-panel" class="collapse-panel-btn" aria-label="Collapse preview" title="Collapse Preview Panel">◀</button>
        </div>
        <!-- TOP: Preview Canvas -->
        <div class="right-preview">
          <div id="canvas-wrap">
            <div id="preview-empty-hint" class="preview-empty-hint">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>Drop asset here to preview</span>
            </div>
            <div id="pixi-container"></div>
            <div id="asset-container" style="display:none; width: 100%; height: 100%; align-items: center; justify-content: center; position: absolute; top:0; left:0;"></div>
            <div id="grid-container" class="grid-container" style="display:none"></div>
          </div>
        </div>

        <!-- BOTTOM: Controls + Properties (50% height) -->
        <div class="right-bottom">
          <!-- Left column: Animation Controls -->
          <div id="controls" class="controls-embedded">
            <!-- Character selector (shown when multiple JSONs loaded) -->
            <div class="ctrl-section" id="char-section" style="display:none">
              <div class="ctrl-label">Character
                <span class="ctrl-btn-group">
                  <button id="btn-char-grid" class="ctrl-btn-mini active" title="View All Characters">⊞ Grid</button>
                  <button id="btn-char-single" class="ctrl-btn-mini" title="View Single Character">◻ Single</button>
                </span>
              </div>
              <select id="char-select" class="ctrl-select"></select>
            </div>

            <!-- Animation selector -->
            <div class="ctrl-section" id="anim-section">
              <div class="ctrl-label">Animation
                <span class="ctrl-btn-group">
                  <button id="btn-anim-grid" class="ctrl-btn-mini active" title="View All Animations">⊞ All</button>
                  <button id="btn-anim-single" class="ctrl-btn-mini" title="View Single Animation">◻ Single</button>
                </span>
              </div>
              <select id="anim-select" class="ctrl-select"></select>
            </div>

            <!-- Playback -->
            <div class="ctrl-section">
              <div class="ctrl-label">Playback</div>
              <div class="ctrl-row">
                <button id="btn-play" class="ctrl-btn active" title="Play" aria-label="Play">▶</button>
                <button id="btn-pause" class="ctrl-btn" title="Pause" aria-label="Pause">⏸</button>
                <button id="btn-loop" class="ctrl-btn active" title="Loop" aria-label="Toggle loop"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
              </div>
            </div>

            <!-- Speed -->
            <div class="ctrl-section">
              <div class="ctrl-label">Speed <span id="speed-val" class="ctrl-val">1.0x</span></div>
              <input id="speed-slider" type="range" min="0.1" max="3" step="0.1" value="1" class="ctrl-range" />
            </div>

            <!-- Scale -->
            <div class="ctrl-section">
              <div class="ctrl-label">Scale <span id="scale-val" class="ctrl-val">1.0x</span></div>
              <input id="scale-slider" type="range" min="0.1" max="5" step="0.1" value="1" class="ctrl-range" />
            </div>

            <!-- Skin -->
            <div class="ctrl-section" id="skin-section" style="display:none">
              <div class="ctrl-label">Skin</div>
              <select id="skin-select" class="ctrl-select"></select>
            </div>

            <div class="ctrl-section">
              <div class="ctrl-label">Background</div>
              <div class="ctrl-row" style="gap:4px">
                <button id="btn-bg-upload" class="ctrl-btn" style="font-size:11px;flex:1"
                  title="Upload background image">Upload BG</button>
                <button id="btn-bg-clear" class="ctrl-btn" style="font-size:11px;flex:0"
                  title="Clear background image">✕</button>
              </div>
              <input id="bg-file-input" type="file" accept="image/*" style="display:none" />
            </div>

            <!-- Export -->
            <div class="ctrl-section" id="export-section">
              <div class="ctrl-label">Export</div>
              <div class="ctrl-row" style="gap:4px;flex-wrap:wrap">
                <button id="btn-export-config" class="ctrl-btn" style="font-size:10px;flex:1" title="Export runtime config JSON">Config</button>
                <button id="btn-export-zip" class="ctrl-btn" style="font-size:10px;flex:1" title="Export character as ZIP bundle">ZIP Bundle</button>
              </div>
              <div class="ctrl-row" style="gap:4px;margin-top:4px">
                <label style="font-size:10px;color:var(--dim);display:flex;align-items:center;gap:4px;width:100%">
                  Mix Duration
                  <input id="mix-duration" type="range" min="0" max="1" step="0.05" value="0.2" class="ctrl-range" style="flex:1" />
                  <span id="mix-val" style="font-family:var(--mono);min-width:32px;text-align:right">0.2s</span>
                </label>
              </div>
            </div>

            <!-- Add to Library -->
            <div class="ctrl-section">
              <button id="btn-add-library" class="ctrl-btn-full" style="background:var(--accent);display:none">+ Add to Library</button>
            </div>

            <!-- New file -->
            <div class="ctrl-section">
              <button id="btn-new" class="ctrl-btn-full">Load New Files</button>
            </div>
          </div>

          <!-- Right column: Properties & Tags -->
          <div id="right-properties" class="right-properties">
            <div id="props-empty" style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;text-align:center;padding:20px;">
              Select an asset<br>to view properties
            </div>
            <div id="props-content" style="display:none;flex-direction:column;flex:1;overflow-y:auto;"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
